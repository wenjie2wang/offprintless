# For the server "tars" (x86_64, Docker Compose v2+). Uses the EXISTING data in place.
#
#   Build the image from this checkout (branch ww-project-access), then:
#     docker compose build
#     docker compose up -d
#
# The data folder is the one that already holds database/, pdfs/, supplements/ ...
# It is mounted as-is, so the existing library is used directly (no copy, no import).
#
# BACK UP FIRST. The new version upgrades the database schema on first start and
# the old 5.11.x image cannot necessarily read it afterwards:
#     docker stop i-librarian
#     sudo cp -a /media/docker-services/i-librarian/database /media/docker-services/i-librarian/database.bak-$(date +%F)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        TIMEZONE: America/New_York
    image: offprintless:project-access
    container_name: i-librarian          # keeps the current container name, so stop/remove the old one first
    ports:
      - "8185:80"                        # same host port as before; the cloudflare tunnel keeps working
    volumes:
      - /media/docker-services/i-librarian:/i-librarian/data   # existing data, used in place
      - /etc/localtime:/etc/localtime:ro
      - ./config:/i-librarian/config:ro                        # optional ilibrarian.ini (LDAP, cookie_secure)
    environment:
      - TZ=America/New_York
    networks:
      - cloudflare-tunnel
    restart: unless-stopped

networks:
  cloudflare-tunnel:
    name: cloudflare-tunnel
    external: true
