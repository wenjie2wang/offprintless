# Example Docker Compose file for Offprintless.
#
#   Build the image from this checkout, then:
#     docker compose build
#     docker compose up -d
#
# The data folder holds database/, pdfs/, supplements/ ... Mount it as-is so an
# existing library is used directly (no copy, no import). Point the data volume
# below at your data folder (the one that already holds the library, or a new
# empty one).
#
# BACK UP FIRST. The app upgrades the database schema on first start, and the
# old 5.11.x image cannot necessarily read it afterwards. If you are replacing an
# existing "i-librarian" container, stop and remove it first (this one is named
# offprintless), and back up your data folder before the first start.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        TIMEZONE: ${TIMEZONE:-Etc/UTC}
    image: ${IMAGE_TAG:-offprintless:latest}
    container_name: offprintless
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ${DATA_DIR:-./data}:/i-librarian/data     # your data folder: database/, pdfs/, supplements/ ...
      - /etc/localtime:/etc/localtime:ro
      - ./config:/i-librarian/config:ro          # optional ilibrarian.ini (LDAP, cookie_secure)
    environment:
      - TZ=${TZ:-Etc/UTC}
    restart: unless-stopped
